name: Desktop release

on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push origin v0.1.0
  workflow_dispatch:       # manual test build (artifact only, no release)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check data key secret
        shell: pwsh
        env:
          STUDIODESK_DATA_KEY: ${{ secrets.STUDIODESK_DATA_KEY }}
        run: |
          if (-not $env:STUDIODESK_DATA_KEY) { throw "Add the STUDIODESK_DATA_KEY repository secret (see docs/desktop.md)." }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/StudioDesk.Core.Tests -c Release

      - name: Publish (Native AOT, x64)
        env:
          STUDIODESK_DATA_KEY: ${{ secrets.STUDIODESK_DATA_KEY }}
        run: dotnet publish src/StudioDesk.App -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.ver.outputs.value }} -o out/publish

      - name: Verify payload
        shell: pwsh
        run: |
          if (-not (Test-Path out/publish/StudioDesk.exe)) { throw "StudioDesk.exe missing" }
          if (-not (Test-Path out/publish/Data/core.sdpak)) { throw "Data pack missing" }
          if (Get-ChildItem out/publish -Recurse -Filter *.pdb) { throw "Debug symbols must not ship" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.value }}" "/DPublishDir=..\out\publish" installer\StudioDesk.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: StudioDesk-Setup
          path: desktop/out/installer/*.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/installer/*.exe
          generate_release_notes: true
